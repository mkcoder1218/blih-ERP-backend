name: One-time salary gross fix

on:
  push:
    branches:
      - fix-salary-gross
    paths:
      - .github/workflows/fix-salary-gross-once.yml

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@v4
        with:
          ref: fix-salary-gross
          fetch-depth: 0

      - name: Patch salary gross semantics
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          deduction_path = Path("src/modules/finance/salaryDeduction.service.ts")
          deduction = deduction_path.read_text(encoding="utf-8")
          old_regular = (
              '    const regularGrossPay = money(\n'
              '      money(link.baseSalary) +\n'
              '      money(link.housingAllowance) +\n'
              '      money(link.transportAllowance) +\n'
              '      money(link.mealAllowance) +\n'
              '      money(link.otherAllowance) +\n'
              '      money(link.metadata?.tax?.allowanceBreakdown?.perDiem?.amount) +\n'
              '      money(link.metadata?.tax?.allowanceBreakdown?.medical?.amount) +\n'
              '      money(link.metadata?.tax?.allowanceBreakdown?.telecom?.amount)\n'
              '    );'
          )
          new_regular = (
              '    const reconstructedRegularGrossPay = money(\n'
              '      money(link.baseSalary) +\n'
              '      money(link.housingAllowance) +\n'
              '      money(link.transportAllowance) +\n'
              '      money(link.mealAllowance) +\n'
              '      money(link.otherAllowance) +\n'
              '      money(link.metadata?.tax?.allowanceBreakdown?.perDiem?.amount) +\n'
              '      money(link.metadata?.tax?.allowanceBreakdown?.medical?.amount) +\n'
              '      money(link.metadata?.tax?.allowanceBreakdown?.telecom?.amount)\n'
              '    );\n'
              '    const regularGrossPay = money(link.grossPay) > 0\n'
              '      ? money(link.grossPay)\n'
              '      : reconstructedRegularGrossPay;'
          )
          if deduction.count(old_regular) != 1:
              raise SystemExit(f"Expected one regularGrossPay block, found {deduction.count(old_regular)}")
          deduction_path.write_text(deduction.replace(old_regular, new_regular, 1), encoding="utf-8")

          payroll_path = Path("src/modules/finance/payrollTemplate.service.ts")
          payroll = payroll_path.read_text(encoding="utf-8")

          old_payable = '      const payableGrossPay = this.m(effectiveMetadata.payableGrossPay ?? effectiveLink?.grossPay);'
          new_payable = (
              '      const monthlyGrossPay = this.m(effectiveLink?.grossPay ?? effectiveMetadata.monthlyGrossPay);\n'
              '      const payableGrossPay = this.m(effectiveMetadata.payableGrossPay ?? monthlyGrossPay);'
          )
          if payroll.count(old_payable) != 1:
              raise SystemExit(f"Expected one payableGrossPay declaration, found {payroll.count(old_payable)}")
          payroll = payroll.replace(old_payable, new_payable, 1)

          old_row_gross = '        grossPay: payableGrossPay,'
          new_row_gross = '        grossPay: monthlyGrossPay,\n        payableGrossPay,'
          if payroll.count(old_row_gross) != 1:
              raise SystemExit(f"Expected one row gross mapping, found {payroll.count(old_row_gross)}")
          payroll = payroll.replace(old_row_gross, new_row_gross, 1)

          old_paid_gross = '      const grossPay = this.m(row.grossPay);'
          new_paid_gross = '      const grossPay = this.m(row.payableGrossPay ?? row.grossPay);'
          if payroll.count(old_paid_gross) != 1:
              raise SystemExit(f"Expected one paid gross assignment, found {payroll.count(old_paid_gross)}")
          payroll = payroll.replace(old_paid_gross, new_paid_gross, 1)

          payroll_path.write_text(payroll, encoding="utf-8")
          PY

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build
        run: pnpm run build

      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Blih automation"
          git config user.email "actions@github.com"
          git add src/modules/finance/payrollTemplate.service.ts src/modules/finance/salaryDeduction.service.ts
          git commit -m "fix: keep configured gross separate from payable gross"
          git push origin HEAD:fix-salary-gross
