name: Deploy Backend to Hostinger VPS

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: hostinger-backend-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify required files
        shell: bash
        run: |
          set -euo pipefail

          echo "Repository root:"
          pwd
          ls -la

          if [ ! -f package.json ]; then
            echo "::error::package.json was not found in the repository root."
            exit 1
          fi

          if [ ! -f pnpm-lock.yaml ]; then
            echo "::error::pnpm-lock.yaml was not found in the repository root."
            echo "::error::Run pnpm install locally and commit pnpm-lock.yaml."
            exit 1
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: "pnpm"
          cache-dependency-path: "pnpm-lock.yaml"

      - name: Show runtime versions
        run: |
          node --version
          pnpm --version

      - name: Install dependencies
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
        run: pnpm install --frozen-lockfile

      - name: Build TypeScript
        run: pnpm run build

  deploy:
    name: Deploy to Hostinger VPS
    needs: validate
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Validate deployment secrets
        env:
          SSH_HOST: ${{ secrets.HOSTINGER_HOST }}
          SSH_PORT: ${{ secrets.HOSTINGER_PORT || '22' }}
          SSH_USER: ${{ secrets.HOSTINGER_USER }}
          SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          DEPLOY_PATH: ${{ secrets.HOSTINGER_DEPLOY_PATH }}
        shell: bash
        run: |
          set -euo pipefail

          missing=0

          for name in SSH_HOST SSH_PORT SSH_USER SSH_KEY DEPLOY_PATH; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required deployment value: $name"
              missing=1
            fi
          done

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Test whether VPS SSH port is reachable
        env:
          SSH_HOST: ${{ secrets.HOSTINGER_HOST }}
          SSH_PORT: ${{ secrets.HOSTINGER_PORT || '22' }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Testing ${SSH_HOST}:${SSH_PORT}..."

          if timeout 10 bash -c "</dev/tcp/${SSH_HOST}/${SSH_PORT}"; then
            echo "SUCCESS: VPS SSH port is reachable."
          else
            echo "::error::GitHub runner cannot reach the VPS SSH port."
            exit 1
          fi

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        env:
          DEPLOY_PATH: ${{ secrets.HOSTINGER_DEPLOY_PATH }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USER }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          port: ${{ secrets.HOSTINGER_PORT || '22' }}
          timeout: 30s
          command_timeout: 30m
          script_stop: true
          envs: DEPLOY_PATH,REPOSITORY,BRANCH

          script: |
            set -euo pipefail

            if [ -z "${DEPLOY_PATH:-}" ]; then
              echo "HOSTINGER_DEPLOY_PATH is required."
              exit 1
            fi

            mkdir -p "$DEPLOY_PATH"

            if [ ! -d "$DEPLOY_PATH/.git" ]; then
              git clone \
                --branch "$BRANCH" \
                --single-branch \
                "https://github.com/$REPOSITORY.git" \
                "$DEPLOY_PATH"
            fi

            cd "$DEPLOY_PATH"

            git fetch origin "$BRANCH"
            git checkout "$BRANCH"
            git reset --hard "origin/$BRANCH"

            if [ ! -f .env.production ]; then
              echo ".env.production was not found in $DEPLOY_PATH"
              exit 1
            fi

            chmod 600 .env.production

            docker compose config --quiet
            docker compose up -d --build
            docker compose ps
