name: Deploy Backend to Hostinger VPS

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: hostinger-backend-production
  cancel-in-progress: true

jobs:
  validate:
    name: Validate backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm

      - name: Install dependencies
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
        run: npm ci

      - name: Build TypeScript
        run: npm run build

  deploy:
    name: Deploy to Hostinger VPS
    needs: validate
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Validate deployment secrets
        env:
          SSH_HOST: ${{ secrets.HOSTINGER_HOST }}
          SSH_PORT: ${{ secrets.HOSTINGER_PORT || '22' }}
          SSH_USER: ${{ secrets.HOSTINGER_USER }}
          SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          DEPLOY_PATH: ${{ secrets.HOSTINGER_DEPLOY_PATH }}
        run: |
          set -e

          missing=0
          for name in SSH_HOST SSH_PORT SSH_USER SSH_KEY DEPLOY_PATH; do
            if [ -z "${!name}" ]; then
              echo "Missing required deployment secret/env value: $name"
              missing=1
            fi
          done

          if [ "$missing" -ne 0 ]; then
            echo "Add the missing HOSTINGER_* secrets to the repository or production environment secrets."
            exit 1
          fi

      - name: Test whether VPS SSH port is reachable
        env:
          SSH_HOST: ${{ secrets.HOSTINGER_HOST }}
          SSH_PORT: ${{ secrets.HOSTINGER_PORT || '22' }}
        run: |
          set -e

          echo "Testing TCP connection to VPS SSH port..."

          if timeout 10 bash -c "</dev/tcp/${SSH_HOST}/${SSH_PORT}"; then
            echo "SUCCESS: VPS SSH port is reachable."
          else
            echo "FAILED: GitHub runner cannot reach VPS SSH port."
            exit 1
          fi

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        env:
          DEPLOY_PATH: ${{ secrets.HOSTINGER_DEPLOY_PATH }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}

        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USER }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          port: ${{ secrets.HOSTINGER_PORT || '22' }}

          timeout: 30s
          command_timeout: 30m

          envs: DEPLOY_PATH,REPOSITORY,BRANCH

          script: |
            set -eu

            if [ -z "$DEPLOY_PATH" ]; then
              echo "HOSTINGER_DEPLOY_PATH secret is required"
              exit 1
            fi

            mkdir -p "$DEPLOY_PATH"

            if [ ! -d "$DEPLOY_PATH/.git" ]; then
              git clone --branch "$BRANCH" "https://github.com/$REPOSITORY.git" "$DEPLOY_PATH"
            fi

            cd "$DEPLOY_PATH"

            git fetch origin "$BRANCH"
            git checkout "$BRANCH"
            git reset --hard "origin/$BRANCH"

            if [ ! -f .env.production ]; then
              echo ".env.production was not found in $DEPLOY_PATH"
              echo "Create it manually on the VPS before deploying."
              exit 1
            fi

            chmod 600 .env.production

            docker compose pull db
            docker compose up -d --build --remove-orphans
            docker image prune -f

            docker compose ps
