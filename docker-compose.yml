services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped

    env_file:
      - .env.production

    environment:
      POSTGRES_USER: ${DB_USER:?DB_USER must be set in .env.production}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env.production}
      POSTGRES_DB: ${DB_NAME:?DB_NAME must be set in .env.production}

    volumes:
      - pgdata:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  migrate:
    build:
      context: .
      target: runner

    image: blih-erp-backend:latest

    command:
      - pnpm
      - run
      - db:migrate

    env_file:
      - .env.production

    environment:
      NODE_ENV: production
      DB_HOST: db
      DB_PORT: 5432

    depends_on:
      db:
        condition: service_healthy

    restart: "no"

  app:
    build:
      context: .
      target: runner

    image: blih-erp-backend:latest
    restart: unless-stopped

    ports:
      - "${APP_PORT:-4000}:4000"

    env_file:
      - .env.production

    environment:
      NODE_ENV: production
      PORT: 4000
      DB_HOST: db
      DB_PORT: 5432
      DB_SYNC: "false"
      API_VERSION: ${API_VERSION:-v1}

    volumes:
      - uploads_data:/app/uploads

    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:' + (process.env.PORT || 4000) + '/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))\""
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  pgdata:
  uploads_data:
